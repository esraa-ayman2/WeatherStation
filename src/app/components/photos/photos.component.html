<section class="min-h-screen bg-[#0B1120] pt-28 pb-16 text-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2 text-blue-400 font-bold text-xs uppercase tracking-widest mb-1.5">
          <i class="fa-solid fa-camera-retro"></i> Atmospheric Photography
        </div>
        <h2 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">
          Sky & Climate Gallery
        </h2>
      </div>
      <button
        (click)="onBack()"
        class="self-start sm:self-auto text-xs font-semibold px-4 py-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 text-slate-300 hover:text-white transition-all cursor-pointer flex items-center gap-1.5 shadow-sm"
      >
        <i class="fa-solid fa-arrow-left text-blue-400"></i>
        <span>Back to Forecast</span>
      </button>
    </div>

    <!-- Category Filter Chips -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6">
      <button
        *ngFor="let cat of categories"
        (click)="setCategory(cat)"
        [ngClass]="selectedCategory === cat ? 'bg-blue-600 text-white font-semibold shadow-md shadow-blue-900/30' : 'bg-slate-800/40 text-slate-300 hover:text-white hover:bg-slate-800 border border-slate-700/50'"
        class="px-4 py-2 rounded-xl text-xs whitespace-nowrap transition-all cursor-pointer"
      >
        {{ cat }}
      </button>
    </div>

    <!-- Photos Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngIf="allPhotos.length === 0" class="col-span-full empty-live-state">
        <i class="fa-solid fa-camera"></i>
        <h3>No live weather imagery available</h3>
        <p>Photos are hidden until a verified live source is connected.</p>
      </div>
      <div
        *ngFor="let photo of filteredPhotos"
        class="group bg-slate-800/30 rounded-[28px] border border-slate-700/50 overflow-hidden shadow-xl backdrop-blur-md flex flex-col justify-between"
      >
        <div class="relative aspect-4/3 overflow-hidden bg-slate-900">
          <img
            [src]="photo.imageUrl"
            [alt]="photo.title"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
          />
          <div class="absolute inset-0 bg-linear-to-t from-slate-950/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
            <span class="text-xs text-slate-300 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-blue-400"></i> {{ photo.location }}
            </span>
          </div>
        </div>

        <div class="p-5 flex items-center justify-between">
          <div>
            <h4 class="font-bold text-white text-sm group-hover:text-blue-300 transition-colors">
              {{ photo.title }}
            </h4>
            <p class="text-xs text-slate-400 mt-0.5">By {{ photo.photographer }}</p>
          </div>

          <button
            (click)="toggleLike(photo.id)"
            [class.text-rose-400]="likedPhotos[photo.id]"
            [class.text-slate-400]="!likedPhotos[photo.id]"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-700/60 text-xs font-semibold cursor-pointer transition-all active:scale-95"
          >
            <i [class]="likedPhotos[photo.id] ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart'"></i>
            <span>{{ likeCounts[photo.id] }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
