<section class="min-h-screen bg-[#0B1120] pt-28 pb-16 text-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2 text-blue-400 font-bold text-xs uppercase tracking-widest mb-1.5">
          <i class="fa-regular fa-newspaper"></i> Meteorological Briefings
        </div>
        <h2 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">
          Global Weather News
        </h2>
      </div>
      <button
        (click)="onBack()"
        class="self-start sm:self-auto text-xs font-semibold px-4 py-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 text-slate-300 hover:text-white transition-all cursor-pointer flex items-center gap-1.5 shadow-sm"
      >
        <i class="fa-solid fa-arrow-left text-blue-400"></i>
        <span>Back to Forecast</span>
      </button>
    </div>

    <!-- News Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
      <div *ngIf="newsList.length === 0" class="col-span-full empty-live-state">
        <i class="fa-regular fa-newspaper"></i>
        <h3>No live weather bulletins available</h3>
        <p>News is hidden until a verified live source is connected.</p>
      </div>
      <article
        *ngFor="let article of newsList"
        class="bg-slate-800/30 rounded-[28px] border border-slate-700/50 overflow-hidden shadow-xl hover:border-blue-500/40 transition-all duration-300 flex flex-col group backdrop-blur-md"
      >
        <div class="h-48 sm:h-56 relative overflow-hidden bg-slate-900">
          <img
            [src]="article.imageUrl"
            [alt]="article.title"
            (error)="onImageError($event)"
            loading="eager"
            width="800"
            height="320"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
          />
          <span class="absolute top-3 left-3 px-3 py-1 bg-slate-900/80 backdrop-blur-md rounded-full text-xs font-semibold text-blue-300 border border-blue-500/30">
            {{ article.category }}
          </span>
        </div>

        <div class="p-6 sm:p-7 flex-1 flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-4 text-xs text-slate-400 mb-2.5 font-mono">
              <span class="flex items-center gap-1.5">
                <i class="fa-regular fa-calendar"></i>
                {{ article.date }}
              </span>
              <span class="flex items-center gap-1.5">
                <i class="fa-regular fa-clock"></i>
                {{ article.readTime }}
              </span>
            </div>
            <h3 class="text-xl font-bold text-white mb-2.5 group-hover:text-blue-300 transition-colors">
              {{ article.title }}
            </h3>

            <p class="text-slate-300 text-sm leading-relaxed line-clamp-3">
              {{ article.summary }}
            </p>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-700/50 flex items-center justify-between text-xs text-slate-400">
            <span class="font-semibold text-slate-300">{{ article.source }}</span>
            <span class="flex items-center gap-1 text-blue-400 font-semibold group-hover:translate-x-0.5 transition-transform">
              Read Report <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i>
            </span>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
