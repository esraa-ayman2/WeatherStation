<!-- Floating Launch Button -->
<div class="fixed bottom-6 right-6 z-50">
  <button
    *ngIf="!isOpen"
    (click)="toggleChat()"
    type="button"
    class="flex items-center gap-3 px-4 py-3.5 rounded-full bg-linear-to-r from-blue-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 text-white font-semibold text-sm shadow-2xl shadow-blue-500/40 border border-sky-400/30 transition-all duration-300 hover:scale-105 cursor-pointer"
  >
    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
      <i class="fa-solid fa-robot text-base text-white"></i>
    </div>
    <span>Weather Assistant / المساعد الذكي</span>
    <span class="flex h-2.5 w-2.5 relative">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
    </span>
  </button>
</div>

<!-- Chat Window Dialog -->
<div
  *ngIf="isOpen"
  class="fixed bottom-6 right-4 sm:right-6 z-50 w-[calc(100vw-2rem)]  bg-slate-900/95 border border-slate-700/80 rounded-3xl shadow-2xl backdrop-blur-2xl flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-6 duration-300"
>
  <!-- Chat Header -->
  <div class="px-5 py-4 bg-slate-800/80 border-b border-slate-700/70 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-2xl bg-linear-to-tr from-blue-600 to-sky-400 p-0.5 shadow-md shadow-blue-500/20">
        <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
          <i class="fa-solid fa-cloud-bolt text-blue-400 text-sm"></i>
        </div>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h4 class="font-bold text-white text-sm">Weather Assistant</h4>
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        </div>
        <p class="text-[11px] text-slate-400 font-medium">Bilingual English & Arabic Helper</p>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <button
        (click)="closeChat()"
        type="button"
        class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
        aria-label="Close Chat"
      >
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Messages Scroll Container -->
  <div #messagesContainer class="flex-1 p-4 overflow-y-auto space-y-4 scrollbar-thin">
    <div
      *ngFor="let msg of messages"
      [ngClass]="msg.sender === 'user' ? 'flex flex-col items-end' : 'flex flex-col items-start'"
    >
      <div class="flex items-start gap-2 max-w-[88%]" [ngClass]="{'flex-row-reverse': msg.isArabic && msg.sender === 'bot'}">
        <div
          *ngIf="msg.sender === 'bot'"
          class="w-6 h-6 rounded-full bg-blue-600/30 text-blue-400 flex items-center justify-center text-[10px] shrink-0 mt-1 border border-blue-500/30"
        >
          <i class="fa-solid fa-robot"></i>
        </div>

        <div
          [dir]="msg.isArabic ? 'rtl' : 'ltr'"
          [ngClass]="[
            msg.sender === 'user' ? 'bg-blue-600 text-white rounded-2xl rounded-tr-xs' : 'bg-slate-800/95 text-slate-200 border border-slate-700/70 rounded-2xl rounded-tl-xs',
            msg.isArabic ? 'text-right leading-relaxed font-sans' : 'text-left leading-normal'
          ]"
          class="p-3 text-xs sm:text-sm shadow-md"
        >
          <p class="whitespace-pre-line">{{ msg.text }}</p>
        </div>
      </div>

      <span class="text-[10px] text-slate-500 font-mono mt-1 px-1">
        {{ msg.timestamp }}
      </span>

      <!-- Quick Replies (if bot message) -->
      <div
        *ngIf="msg.sender === 'bot' && msg.quickReplies && msg.quickReplies.length > 0"
        [dir]="msg.isArabic ? 'rtl' : 'ltr'"
        class="flex flex-wrap gap-1.5 mt-2"
        [ngClass]="msg.isArabic ? 'pr-2' : 'pl-8'"
      >
        <button
          *ngFor="let qr of msg.quickReplies"
          (click)="sendQuickReply(qr)"
          type="button"
          class="px-2.5 py-1 rounded-lg bg-slate-800/90 hover:bg-blue-600 hover:text-white text-blue-300 border border-slate-700/80 text-[11px] font-medium transition-colors cursor-pointer"
        >
          {{ qr }}
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Input Form -->
  <div class="p-3 bg-slate-800/60 border-t border-slate-700/70">
    <form (ngSubmit)="sendMessage()" class="flex items-center gap-2">
      <input
        type="text"
        [(ngModel)]="userInput"
        name="chatInput"
        appRtlDetector
        placeholder="Type in English or Arabic (اسأل بالعربية أو بالإنجليزية)..."
        class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-xs sm:text-sm font-medium"
      />
      <button
        type="submit"
        [disabled]="!userInput.trim()"
        class="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white flex items-center justify-center transition-all cursor-pointer shadow-md shadow-blue-900/30 shrink-0"
      >
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </form>
  </div>
</div>
