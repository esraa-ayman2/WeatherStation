<aside *ngIf="data" class="w-full mt-5 bg-slate-800/30 border border-slate-700/50 rounded-4xl p-6 backdrop-blur-md flex flex-col justify-between shadow-2xl">
  <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-700/50">
    <h3 class="text-xs uppercase tracking-widest text-slate-400 font-bold">
      7-Day Forecast
    </h3>
    <span class="text-xs font-mono text-blue-400 font-medium">
      {{ data.location.name }}
    </span>
  </div>

  <div class="flex flex-col gap-2.5">
    <div
      *ngFor="let fDay of forecastDays; let idx = index"
      [ngClass]="{
        'bg-blue-600/20 border border-blue-500/30': idx === 0,
        'bg-slate-700/20 border border-slate-700/30': idx === 1,
        'hover:bg-slate-700/20 border border-transparent': idx > 1
      }"
      class="flex items-center justify-between p-3 rounded-2xl transition-all"
    >
      <span class="w-24 font-medium text-sm text-slate-200 truncate">
        {{ getDayName(fDay.date, idx) }}
      </span>

      <div class="flex items-center gap-1">
        <img [src]="getIconUrl(fDay.day.condition.icon)" alt="" class="w-6 h-6 object-contain" />
      </div>

      <span class="w-24 text-right font-mono text-xs sm:text-sm">
        <span class="text-slate-100 font-bold">{{ getMaxTemp(fDay) }}°</span>
        <span class="text-slate-500 ml-1.5 font-normal">{{ getMinTemp(fDay) }}°</span>
      </span>
    </div>
  </div>
</aside>
