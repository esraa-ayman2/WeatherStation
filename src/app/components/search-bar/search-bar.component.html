<div class="search-shell w-full max-w-4xl mx-auto mb-8 relative z-100 isolate overflow-visible">
  <form (ngSubmit)="onSearch()" class="relative flex items-center">
    <div class="relative w-full flex items-center bg-slate-800/40 border border-slate-700/60 rounded-2xl p-1.5 focus-within:border-transparent focus-within:shadow-[0_0_24px_rgba(37,99,235,0.38)] transition-all shadow-xl backdrop-blur-xl">
      <!-- Search Icon -->
      <div class="pl-3.5 text-slate-400">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </div>

      <!-- Search Input with Autocomplete Events -->
      <input
        id="weather-search-input"
        type="text"
        [(ngModel)]="searchQuery"
        (input)="onInputChange()"
        (focus)="onInputFocus()"
        (keydown)="onKeyDown($event)"
        name="searchQuery"
        autocomplete="off"
        dir="auto"
        aria-label="Search for a city"
        placeholder="Search in Arabic or English (مثال: القاهرة أو Cairo أو London)..."
        class="w-full px-3.5 py-2.5 bg-transparent text-white placeholder-slate-400 focus:outline-none text-sm sm:text-base font-medium"
      />

      <!-- Autocomplete Spinner Indicator -->
      <div
        *ngIf="isSearchingSuggestions"
        class="absolute right-28 -top-6 z-60 flex items-center gap-1.5 text-[11px] text-slate-300"
        aria-live="polite"
      >
        <i class="fa-solid fa-circle-notch fa-spin text-xs text-blue-400"></i>
        <span>Searching...</span>
      </div>

      <!-- Location Detect Button -->
      <button
        id="weather-detect-location-btn"
        type="button"
        (click)="detectCurrentLocation()"
        title="Detect My Location"
        class="px-3 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors mr-1 cursor-pointer"
      >
        <i class="fa-solid fa-location-crosshairs text-base text-blue-400"></i>
      </button>

      <!-- Submit Search Button -->
      <button
        id="weather-search-submit-btn"
        type="submit"
        class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-semibold text-xs sm:text-sm transition-all duration-200 cursor-pointer shadow-lg shadow-blue-900/30 whitespace-nowrap flex items-center gap-1.5"
      >
        <span *ngIf="!isLoading">Search</span>
        <span *ngIf="isLoading" class="flex items-center gap-1.5">
          <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
          <span>Tracking...</span>
        </span>
      </button>
    </div>
  </form>

  <!-- Live Location Options Dropdown (As You Type) -->
  <div
    *ngIf="showSuggestions && suggestions.length > 0"
    class="absolute left-0 right-0 top-full mt-2 z-9999 bg-[#101a2d]/98 border border-slate-700/90 rounded-2xl shadow-2xl backdrop-blur-2xl overflow-hidden py-2 divide-y divide-slate-800/80 animate-in fade-in zoom-in-95 duration-150"
  >
    <div class="px-4 py-2 flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800">
      <span class="flex items-center gap-1.5 text-blue-400">
        <i class="fa-solid fa-location-dot text-xs"></i> Matching Stations
      </span>
      <span class="hidden sm:inline">Use &uarr;&darr; keys to navigate</span>
    </div>

    <div class="max-h-64 overflow-y-auto scrollbar-thin">
      <button
        *ngFor="let loc of suggestions; let idx = index"
        type="button"
        (click)="selectSuggestion(loc)"
        (mouseenter)="highlightedIndex = idx"
        [class.bg-slate-800]="highlightedIndex === idx"
        [class.text-blue-300]="highlightedIndex === idx"
        class="w-full text-left px-4 py-3 flex items-center justify-between hover:bg-slate-800/80 transition-colors cursor-pointer group"
      >
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition-colors">
            <i class="fa-solid fa-city text-xs"></i>
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-semibold text-white group-hover:text-blue-300 transition-colors">
              {{ loc.name }} <span *ngIf="loc.arabicName" class="text-slate-300">({{ loc.arabicName }})</span>
            </span>
            <span class="text-xs text-slate-400">
              {{ loc.region ? loc.region + ', ' : '' }}{{ loc.country }}
            </span>
          </div>
        </div>

        <div class="text-right flex items-center gap-2">
          <span *ngIf="loc.lat && loc.lon" class="text-[10px] font-mono text-slate-500 hidden sm:inline">
            {{ loc.lat }}&deg;, {{ loc.lon }}&deg;
          </span>
          <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-blue-400 group-hover:translate-x-0.5 transition-all"></i>
        </div>
      </button>
    </div>
  </div>

  <!-- Search Validation Error Alert -->
  <div *ngIf="searchError" class="mt-2.5 px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2 animate-in fade-in duration-200">
    <i class="fa-solid fa-circle-exclamation text-xs text-rose-400"></i>
    <span>{{ searchError }}</span>
  </div>
</div>
